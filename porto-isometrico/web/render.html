<script type="module">
  import { setup } from "./render.js";
  // pipeline/render.mjs espera por window.ready e chama window.R.renderTile(c, r)
  window.ready = setup().then(R => { window.R = R; return { grid: R.grid, tile: R.tile, mpp: R.mpp, labels: R.labels, credits: R.credits }; })

</script>
